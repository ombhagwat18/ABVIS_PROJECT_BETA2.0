      <stop offset="0" stop-color="#2F6FED"/>
      <stop offset="1" stop-color="#14243A"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 8)">
    <circle cx="112" cy="112" r="88" fill="none" stroke="#D8E0E9" stroke-width="12"/>
    <path d="M112 24 A88 88 0 0 1 188 68" fill="none" stroke="#16A6A1" stroke-width="16" stroke-linecap="round"/>
    <path d="M188 156 A88 88 0 0 1 112 200" fill="none" stroke="#2F6FED" stroke-width="16" stroke-linecap="round"/>
    <path d="M36 156 A88 88 0 0 1 36 68" fill="none" stroke="#14243A" stroke-width="16" stroke-linecap="round"/>
    <path d="M74 55 L99 79 L84 108 L111 135 L145 101 L169 125 L145 158 L111 181 L78 157 L54 128 L68 94 Z"
