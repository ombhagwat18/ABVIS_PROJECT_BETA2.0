    <circle cx="112" cy="112" r="36" fill="#FFFFFF"/>
    <circle cx="112" cy="112" r="25" fill="#EAF2FF" stroke="#2F6FED" stroke-width="6"/>
    <path d="M98 112 L108 123 L129 99" fill="none" stroke="#16A6A1" stroke-width="10" stroke-linecap="round"
