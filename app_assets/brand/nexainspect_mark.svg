<svg xmlns="http://www.w3.org/2000/svg"
     width="240" height="240" viewBox="0 0 240 240">
  <title>NexaInspect mark</title>
  <!-- The lens-and-check symbol of nexainspect_logo.svg on its own, strokes slightly heavier so it stays legible
       at 32 x 32 and 16 x 16 (application icon, header, report corner). -->
